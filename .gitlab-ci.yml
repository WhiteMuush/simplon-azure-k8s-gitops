stages:
  - validate
  - plan
  - apply
  - deploy

variables:
  TF_HTTP_USERNAME: gitlab-ci-token
  TF_HTTP_PASSWORD: $CI_JOB_TOKEN
  ARM_USE_OIDC: "true"
  ARM_OIDC_TOKEN: $GITLAB_OIDC_TOKEN
  TF_VAR_subscription_id: $ARM_SUBSCRIPTION_ID
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

.azure_oidc:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: api://AzureADTokenExchange

.terraform:
  extends: .azure_oidc
  image:
    name: hashicorp/terraform:1.14
    entrypoint: [""]
  interruptible: true
  before_script:
    - cd "terraform/${STACK}"
    - terraform init -input=false

validate:
  extends: .terraform
  stage: validate
  parallel:
    matrix:
      - STACK: [storage, kubernetes]
  script:
    - terraform fmt -check -recursive
    - terraform validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

plan:
  extends: .terraform
  stage: plan
  needs: ["validate"]
  parallel:
    matrix:
      - STACK: [storage, kubernetes]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never
  script:
    - terraform plan -out=plan.tfplan
    - terraform show -no-color plan.tfplan > plan.txt
  artifacts:
    paths:
      - terraform/${STACK}/plan.tfplan
      - terraform/${STACK}/plan.txt
    expire_in: 7 days

apply:storage:
  extends: .terraform
  stage: apply
  needs: ["plan"]
  variables:
    STACK: storage
  environment:
    name: production/storage
  script:
    - terraform apply -auto-approve plan.tfplan
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - when: never

apply:kubernetes:
  extends: .terraform
  stage: apply
  needs: ["plan", "apply:storage"]
  variables:
    STACK: kubernetes
  environment:
    name: production/kubernetes
  script:
    - terraform apply -auto-approve plan.tfplan
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - when: never

# Reads the cluster coordinates from the state so the deploy jobs need neither a
# Terraform binary nor hardcoded names.
outputs:
  extends: .terraform
  stage: deploy
  variables:
    STACK: kubernetes
  script:
    - |
      {
        echo "AKS_CLUSTER_NAME=$(terraform output -raw cluster_name)"
        echo "AKS_RESOURCE_GROUP=$(terraform output -raw resource_group_name)"
        echo "VELERO_IDENTITY_CLIENT_ID=$(terraform output -raw velero_identity_client_id)"
      } > "$CI_PROJECT_DIR/cluster.env"
  artifacts:
    reports:
      dotenv: cluster.env
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

# Local accounts are disabled on the cluster, so kubectl authenticates through
# Entra ID: the same OIDC token as Terraform, converted by kubelogin.
.kubernetes:
  extends: .azure_oidc
  image: mcr.microsoft.com/azure-cli:latest
  interruptible: true
  variables:
    HELM_VERSION: v3.19.0
  needs: ["outputs"]
  before_script:
    # The azure-cli image ships neither tar nor git, both needed by the helm installer.
    - tdnf install -y tar git bash || apk add --no-cache tar git bash || (apt-get update && apt-get install -y tar git bash)
    - az aks install-cli
    - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | DESIRED_VERSION="$HELM_VERSION" bash
    - az login --service-principal --username "$ARM_CLIENT_ID" --tenant "$ARM_TENANT_ID" --federated-token "$GITLAB_OIDC_TOKEN" --output none
    - az account set --subscription "$ARM_SUBSCRIPTION_ID"
    - az aks get-credentials --resource-group "$AKS_RESOURCE_GROUP" --name "$AKS_CLUSTER_NAME" --overwrite-existing
    - kubelogin convert-kubeconfig -l azurecli
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - when: never

deploy:argocd:
  extends: .kubernetes
  stage: deploy
  environment:
    name: production/argocd
  script:
    - bash scripts/kubernetes/argocd.sh install
    - bash scripts/kubernetes/argocd.sh status

deploy:velero:
  extends: .kubernetes
  stage: deploy
  environment:
    name: production/velero
  script:
    - bash scripts/backup/velero.sh install
    - bash scripts/backup/velero.sh status
